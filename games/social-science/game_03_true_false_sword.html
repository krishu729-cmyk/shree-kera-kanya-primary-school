<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>⚔️ ખરું કે ખોટું – Sword Battle</title><style>
:root{--ink:#172033;--muted:#667085;--accent:#7c3aed}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Gujarati","Nirmala UI","Shruti",system-ui,sans-serif;background:linear-gradient(135deg,#eef2ff,#fff7ed);color:var(--ink)}
.app{min-height:100vh;padding:16px}.top{max-width:1050px;margin:auto;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-size:clamp(20px,4vw,32px);font-weight:900}.sub{color:var(--muted);font-size:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer;touch-action:manipulation;box-shadow:0 5px 14px #00000012}
.btn{background:#fff;color:var(--ink)}.primary{background:var(--accent);color:#fff}
.game{max-width:1050px;margin:16px auto;background:#ffffffdd;backdrop-filter:blur(8px);border-radius:28px;padding:18px;box-shadow:0 18px 50px #312e8118}
.hud{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}.progress{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#7c3aed,#06b6d4);transition:.4s}.pill{background:#f8fafc;border:1px solid #e5e7eb;padding:9px 12px;border-radius:999px;font-weight:800}
.scene{margin-top:16px;min-height:390px;border-radius:24px;padding:22px;position:relative;overflow:hidden;background:linear-gradient(160deg,#172554,#4c1d95 55%,#0f766e);color:#fff}
.content{position:relative;z-index:1;max-width:900px;margin:auto}.emoji{font-size:60px;text-align:center;animation:float 2.2s ease-in-out infinite}.question{background:#ffffffee;color:var(--ink);border-radius:20px;padding:18px;font-size:clamp(20px,4vw,30px);font-weight:900;text-align:center;margin:14px 0}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.opt{background:#fff;color:#172033;min-height:64px;font-size:18px;text-align:left}.feedback{text-align:center;min-height:38px;margin-top:12px;font-weight:900;font-size:20px}
input,textarea{width:100%;border:2px solid #dbe2f0;border-radius:16px;padding:14px;font:inherit;background:#fff;color:#172033}textarea{min-height:150px;resize:vertical}
.cards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.word{background:#fff;color:#172033;border:3px solid #e2e8f0;padding:12px 15px;border-radius:16px;font-weight:900;cursor:grab}.answerbox{min-height:64px;background:#ffffffd9;color:#172033;border:3px dashed #c4b5fd;border-radius:18px;padding:14px;text-align:center;font-weight:900}
.center{text-align:center}.result{display:grid;gap:10px;text-align:center;place-items:center}.scorebig{font-size:64px;font-weight:1000}.badge{font-size:24px;font-weight:900;padding:12px 20px;border-radius:999px;background:#fef3c7;color:#92400e}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.matchcol{display:grid;gap:10px}.matchcard{background:#fff;color:#172033;border-radius:16px;padding:15px;font-weight:900;cursor:pointer;border:3px solid transparent}.matchcard.sel{border-color:#7c3aed;background:#ede9fe}.matchcard.done{border-color:#16a34a;background:#dcfce7}
.hint{background:#fef3c7;color:#78350f;border-radius:14px;padding:12px;margin-top:10px;font-weight:800}.keywords{display:flex;flex-wrap:wrap;gap:9px}.kw{padding:10px 13px;border-radius:999px;background:#fff;color:#172033;font-weight:900;cursor:pointer;border:3px solid transparent}.kw.on{border-color:#7c3aed;background:#ede9fe}
.teacher{background:#0f172a;color:#fff;border-radius:18px;padding:15px;margin-top:12px}.teacher pre{white-space:pre-wrap;font:inherit}.hidden{display:none!important}
@keyframes float{50%{transform:translateY(-8px)}}@keyframes shake{25%,75%{transform:translateX(-8px)}50%{transform:translateX(8px)}}@keyframes jump{50%{transform:translateY(-45px)}}@keyframes flash{50%{filter:brightness(1.6)}}
@media(max-width:650px){.hud{grid-template-columns:1fr 1fr}.hud .progress{grid-column:1/-1}.options{grid-template-columns:1fr}.matchgrid{grid-template-columns:1fr}.scene{min-height:430px;padding:14px}.game{padding:12px}.question{font-size:20px}}
</style></head><body><div class="app"><div class="top"><div><div class="brand">⚔️ ખરું કે ખોટું – Sword Battle</div><div class="sub">ધોરણ 7 સામાજિક વિજ્ઞાન • પ્રશ્ન 3</div></div><div class="toolbar"><button class="btn" onclick="toggleSound()">🔊 અવાજ</button><button class="btn" onclick="toggleFull()">⛶ Fullscreen</button><button class="btn" onclick="restart()">↻ Restart</button></div></div><div class="game"><div class="hud"><div class="progress"><div class="bar" id="bar"></div></div><div class="pill" id="qcount">પ્રશ્ન</div><div class="pill">⭐ <span id="score">0</span></div></div><div class="scene"><div class="content" id="content"></div></div></div></div><script>
let soundOn=true;
function tone(freq,dur=.12,type="sine",vol=.04){if(!soundOn)return;try{const A=window.AudioContext||window.webkitAudioContext,c=new A(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);o.stop(c.currentTime+dur)}catch(e){}}
function correctSound(){tone(740,.09);setTimeout(()=>tone(980,.12),90)}function wrongSound(){tone(180,.18,"sawtooth",.025)}function winSound(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.15),i*100))}function clickSound(){tone(420,.05)}

function toggleSound(){soundOn=!soundOn;event.target.textContent=soundOn?"🔊 અવાજ":"🔇 અવાજ";clickSound()}
function toggleFull(){document.documentElement.requestFullscreen?.()}
function restart(){location.reload()}
function setHud(i,total,score){document.getElementById("qcount").textContent=`પ્રશ્ન ${Math.min(i+1,total)}/${total}`;document.getElementById("score").textContent=score;document.getElementById("bar").style.width=(i/total*100)+"%"}
function finish(total,correct,maxScore){document.getElementById("bar").style.width="100%";let pct=maxScore?Math.round(correct/maxScore*100):0;let badge=pct>=90?"🏆 History Champion":pct>=75?"🌟 Excellent Explorer":pct>=50?"👍 Good Learner":"💪 Practice Hero";document.getElementById("content").innerHTML=`<div class="result"><div class="emoji">🎉</div><h2>Game Complete!</h2><div class="scorebig">${correct}/${maxScore}</div><div>Accuracy: ${pct}%</div><div class="badge">${badge}</div><button class="primary" onclick="restart()">🔁 ફરી રમો</button></div>`;winSound();localStorage.setItem(location.pathname+"Best",Math.max(Number(localStorage.getItem(location.pathname+"Best")||0),correct))}
const data=[["રાણીની વાવનું નિર્માણ રાજા ભોજની યાદમાં કરવામાં આવ્યું હતું.", false], ["રઝિયા સુલતાના ભારતના ઇતિહાસની પ્રથમ મુસ્લિમ મહિલા શાસક હતી.", true], ["દિલ્હી સલ્તનતનું શાસન પાંચ મુખ્ય વંશો દ્વારા ચલાવવામાં આવ્યું હતું.", true], ["હલ્દીઘાટી ના યુદ્ધમાં મહારાણા પ્રતાપનો વિજય થયો હતો.", false], ["સિસ્મોગ્રાફ નામના યંત્રથી ભૂકંપની તીવ્રતા માપી શકાય છે.", true]];let i=0,score=0,locked=false;function render(){locked=false;setHud(i,5,score);content.innerHTML=`<div class="emoji">⚔️🛡️</div><div class="question">${data[i][0]}</div><div class="options"><button class="opt" onclick="answer(true)">🟢 ખરું</button><button class="opt" onclick="answer(false)">🔴 ખોટું</button></div><div class="feedback" id="fb"></div>`}function answer(v){if(locked)return;locked=true;let ok=v===data[i][1];fb.textContent=ok?"⚔️ સાચો નિર્ણય!":"🙂 ફરી પ્રયત્ન કરો!";ok?correctSound():wrongSound();if(ok)score++;document.getElementById("score").textContent=score;setTimeout(()=>i<4?(i++,render()):finish(5,score,5),800)}render();</script></body></html>
