<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classify Healthy and Unhealthy Food</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Comic Sans MS',sans-serif;color:#24304a;background:linear-gradient(135deg,#ffe9f2,#fff5cb 55%,#d9f8ee);min-height:100vh}.app{max-width:850px;margin:auto;padding:18px;text-align:center}h1{font-size:clamp(2rem,6vw,3.5rem);color:#873c95;margin:12px 0}p{font-size:1.15rem}.panel{background:#fff;border-radius:28px;padding:20px;box-shadow:0 15px 35px #53497b22;margin-top:18px}.stats{display:flex;justify-content:space-between;gap:10px;font-size:1.1rem;font-weight:800}.badge{background:#f2edff;border-radius:30px;padding:9px 14px}.track{height:12px;border-radius:20px;background:#ecebf2;overflow:hidden;margin:18px 0}.fill{height:100%;background:#65d894;transition:width .25s}.food{font-size:clamp(5rem,17vw,8rem);line-height:1.3;animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}h2{font-size:clamp(1.8rem,5vw,2.6rem);margin:0 0 5px}.hint{color:#596678;font-size:1.1rem}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}button{font:inherit;font-size:1.15rem;font-weight:800;border:0;border-radius:19px;min-height:75px;padding:12px;cursor:pointer;box-shadow:0 6px 0 #0002}button:active{transform:translateY(3px);box-shadow:0 3px 0 #0002}button:disabled{opacity:.6;cursor:default}.healthy{background:#bff1cd;color:#125d31}.unhealthy{background:#ffd4de;color:#8c2744}.next{background:#674ac6;color:white;padding:12px 25px;min-height:55px}.feedback{min-height:76px;border-radius:16px;padding:12px;font-size:1.1rem;font-weight:700}.yes{background:#e0fae9;color:#185f36}.no{background:#fff0dd;color:#704516}.hide{display:none}.footer{color:#606a77;font-size:.85rem;margin-top:20px}@media(max-width:520px){.choices{grid-template-columns:1fr}button{min-height:65px}}
</style></head><body><div class="app"><h1>🍎 Food Sorting Game 🍟</h1><p>Look at the food. Is it a <strong>healthy everyday choice</strong> or a <strong>sometimes food</strong>?</p><div class="panel"><div class="stats"><span class="badge" id="progress"></span><span class="badge" id="score"></span></div><div class="track"><div class="fill" id="fill"></div></div><div id="game"><div class="food" id="picture" aria-hidden="true"></div><h2 id="foodName"></h2><p class="hint">Tap the correct basket ↓</p><div class="choices"><button class="healthy" data-kind="healthy">🥦 Healthy food<br><small>Eat often</small></button><button class="unhealthy" data-kind="sometimes">🍬 Sometimes food<br><small>Eat less often</small></button></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><button id="next" class="next hide">Next food ➜</button></div><div id="result" class="hide"><div style="font-size:4rem">🏆</div><h2>Great job!</h2><p id="summary"></p><button class="next" id="restart">Play again ↻</button></div></div><p class="footer">A balanced meal includes different foods. “Sometimes food” means enjoy in moderation.<br>Created by Krishna R. Budhabhatti</p></div><script>
const items=[
{icon:'🍎',name:'Apple',kind:'healthy',reason:'Fruit is a good everyday choice.'},{icon:'🥕',name:'Carrot',kind:'healthy',reason:'Vegetables help make meals balanced.'},{icon:'🍌',name:'Banana',kind:'healthy',reason:'Bananas are fruits with useful nutrients.'},{icon:'🥬',name:'Leafy vegetables',kind:'healthy',reason:'Try to eat a variety of vegetables.'},{icon:'🫘',name:'Beans',kind:'healthy',reason:'Beans provide protein and fibre.'},{icon:'🥛',name:'Milk',kind:'healthy',reason:'Milk provides protein and calcium.'},{icon:'🍊',name:'Orange',kind:'healthy',reason:'Fresh fruit is a healthy choice.'},{icon:'🍚',name:'Rice',kind:'healthy',reason:'Rice gives energy. Add vegetables and lentils for a balanced meal.'},
{icon:'🍬',name:'Candy',kind:'sometimes',reason:'Candy is high in sugar. Have it only sometimes.'},{icon:'🥤',name:'Sugary drink',kind:'sometimes',reason:'Choose water more often than sugary drinks.'},{icon:'🍟',name:'French fries',kind:'sometimes',reason:'Fried foods are best eaten less often.'},{icon:'🍩',name:'Doughnut',kind:'sometimes',reason:'Doughnuts are sugary treats.'},{icon:'🍰',name:'Cake',kind:'sometimes',reason:'Enjoy cake occasionally.'},{icon:'🍦',name:'Ice cream',kind:'sometimes',reason:'Ice cream is a sometimes treat.'},{icon:'🍪',name:'Sweet biscuits',kind:'sometimes',reason:'Sweet biscuits often contain a lot of sugar.'},{icon:'🍫',name:'Chocolate',kind:'sometimes',reason:'Enjoy chocolate in small amounts occasionally.'}
];const $=id=>document.getElementById(id);let cards=[],at=0,points=0,locked=false;function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){cards=shuffle(shuffle(items.filter(x=>x.kind==='healthy')).slice(0,6).concat(shuffle(items.filter(x=>x.kind==='sometimes')).slice(0,6)));at=0;points=0;$('result').classList.add('hide');$('game').classList.remove('hide');show()}function show(){locked=false;let x=cards[at];$('picture').textContent=x.icon;$('foodName').textContent=x.name;$('score').textContent=`Score: ${points}`;$('progress').textContent=`Food ${at+1} of ${cards.length}`;$('fill').style.width=`${at/cards.length*100}%`;$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hide');document.querySelectorAll('[data-kind]').forEach(b=>b.disabled=false)}function answer(kind){if(locked)return;locked=true;let x=cards[at],ok=kind===x.kind;if(ok)points++;$('score').textContent=`Score: ${points}`;$('feedback').textContent=(ok?'Correct! 🌟 ':'Good try! 💡 ')+x.reason;$('feedback').classList.add(ok?'yes':'no');document.querySelectorAll('[data-kind]').forEach(b=>b.disabled=true);$('next').textContent=at===cards.length-1?'See my score ➜':'Next food ➜';$('next').classList.remove('hide')}document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>answer(b.dataset.kind)));$('next').addEventListener('click',()=>{at++;if(at<cards.length)show();else{$('game').classList.add('hide');$('result').classList.remove('hide');$('fill').style.width='100%';$('summary').textContent=`You scored ${points} out of ${cards.length}!`;}});$('restart').addEventListener('click',start);start();
</script></body></html>
