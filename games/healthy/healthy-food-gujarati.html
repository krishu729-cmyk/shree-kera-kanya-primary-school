<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Healthy Food Game | ખોરાક ઓળખો</title>
<style>
:root{font-family:system-ui,'Noto Sans Gujarati',sans-serif;color:#26334d;background:#fff3d8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 10%,#ffe0ef,transparent 35%),radial-gradient(circle at 95% 25%,#d3f7e1,transparent 35%),#fff3d8}.wrap{max-width:850px;margin:auto;padding:18px}header{text-align:center}h1{font-size:clamp(2rem,6vw,3.3rem);margin:15px 0 4px;color:#9341a5}p{line-height:1.55}.tag{display:inline-block;background:#fff;border-radius:99px;padding:6px 18px;box-shadow:0 4px 12px #0001}.card{background:#fff;border-radius:30px;padding:clamp(20px,5vw,40px);margin:22px auto;box-shadow:0 14px 35px #57498222;text-align:center}.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:800;font-size:1.1rem}.pill{background:#f0ecff;padding:10px 16px;border-radius:99px}.progress{height:13px;background:#eae9f0;border-radius:99px;overflow:hidden;margin:18px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,#4acb78,#a6df56);transition:width .35s}.food{font-size:clamp(5rem,19vw,9rem);line-height:1.25;filter:drop-shadow(0 8px 5px #0002);animation:float 2.5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-7px)}}h2{font-size:clamp(1.7rem,5vw,2.6rem);margin:6px}.en{font-size:1.25rem;color:#56617b;margin:0 0 15px}.question{font-size:1.2rem;font-weight:700}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}button{border:0;cursor:pointer;font:inherit;font-weight:800;border-radius:20px;padding:17px 14px;min-height:64px;box-shadow:0 6px 0 #0002;transition:transform .15s}button:active{transform:translateY(4px);box-shadow:0 2px 0 #0002}button:disabled{opacity:.65;cursor:default}.good{background:#b9f4c7;color:#145b31}.sometimes{background:#ffd1d9;color:#902640}.next{background:#6545c6;color:white;margin-top:18px;padding-inline:30px}.feedback{min-height:75px;margin-top:18px;padding:12px;border-radius:16px;font-size:1.12rem;font-weight:700}.feedback.correct{background:#e0f8e5;color:#126337}.feedback.wrong{background:#fff1da;color:#794a0d}.hidden{display:none}.small{font-size:.91rem;color:#667084}footer{text-align:center;padding:8px 0 25px}.stars{font-size:2.2rem} @media(max-width:520px){.choices{grid-template-columns:1fr}button{min-height:60px}.card{margin-top:14px}}
</style>
</head><body><div class="wrap"><header><div class="tag">🍎 Healthy Food • Fun Learning 🥕</div><h1>ખોરાક ઓળખો!</h1><p>ચિત્ર જુઓ અને યોગ્ય જવાબ પસંદ કરો.</p></header><main class="card"><div class="top"><span class="pill" id="count">પ્રશ્ન ૧ / ૧૨</span><span class="pill" id="score">સ્કોર: ૦</span></div><div class="progress"><div class="bar" id="bar"></div></div><div id="play"><div class="food" id="emoji" aria-hidden="true"></div><h2 id="name"></h2><p class="en" id="english"></p><p class="question">આ ખોરાક કેટલી વાર ખાવો જોઈએ?</p><div class="choices"><button class="good" data-answer="daily">🥦 વારંવાર ખાવા યોગ્ય<br><small>Healthy choice</small></button><button class="sometimes" data-answer="sometimes">🍭 ક્યારેક જ ખાવું<br><small>Sometimes food</small></button></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button class="next hidden" id="next">આગળનું ➜</button></div><div id="finish" class="hidden"><div class="stars" id="stars"></div><h2>શાબાશ! 🎉</h2><p id="final"></p><button class="next" id="restart">ફરી રમો ↻</button></div></main><footer class="small">ખોરાકમાં વિવિધતા રાખો, પાણી પીઓ અને મીઠાઈ કે તળેલો ખોરાક મર્યાદામાં ખાવો.<br>Created by Krishna R. Budhabhatti</footer></div>
<script>
const foods=[
 {emoji:'🍎',gu:'સફરજન',en:'Apple',answer:'daily',why:'ફળમાંથી રેસા અને પોષક તત્ત્વો મળે છે.'},
 {emoji:'🥕',gu:'ગાજર',en:'Carrot',answer:'daily',why:'શાકભાજી રોજના ભોજનમાં ઉપયોગી છે.'},
 {emoji:'🥛',gu:'દૂધ',en:'Milk',answer:'daily',why:'દૂધમાંથી પ્રોટીન અને કૅલ્શિયમ મળે છે.'},
 {emoji:'🍌',gu:'કેળું',en:'Banana',answer:'daily',why:'કેળું ફળ છે અને તેમાં ઉપયોગી પોષક તત્ત્વો છે.'},
 {emoji:'🥬',gu:'લીલાં શાકભાજી',en:'Leafy vegetables',answer:'daily',why:'ભોજનમાં વિવિધ શાકભાજી લેવી સારી ટેવ છે.'},
 {emoji:'🫘',gu:'કઠોળ',en:'Beans',answer:'daily',why:'કઠોળમાંથી પ્રોટીન અને રેસા મળે છે.'},
 {emoji:'🍊',gu:'નારંગી',en:'Orange',answer:'daily',why:'તાજાં ફળો સંતુલિત આહારનો ભાગ છે.'},
 {emoji:'🍚',gu:'ભાત',en:'Rice',answer:'daily',why:'ભાતથી ઊર્જા મળે છે; શાક અને દાળ સાથે સંતુલિત ભોજન બને છે.'},
 {emoji:'🍬',gu:'કેન્ડી',en:'Candy',answer:'sometimes',why:'કેન્ડીમાં ખાંડ વધુ હોય છે; ક્યારેક જ ખાવું.'},
 {emoji:'🥤',gu:'મીઠું પીણું',en:'Sugary drink',answer:'sometimes',why:'મીઠાં પીણાંમાં ખાંડ વધુ હોય છે; તેના બદલે પાણી પીવું.'},
 {emoji:'🍟',gu:'ફ્રેન્ચ ફ્રાઇઝ',en:'French fries',answer:'sometimes',why:'તળેલો ખોરાક મર્યાદામાં ખાવો.'},
 {emoji:'🍩',gu:'ડોનટ',en:'Doughnut',answer:'sometimes',why:'મીઠાઈમાં ખાંડ વધુ હોય છે; ક્યારેક જ ખાવું.'},
 {emoji:'🍫',gu:'ચૉકલેટ',en:'Chocolate',answer:'sometimes',why:'ચૉકલેટ મીઠાઈ છે; રોજની ટેવ ન બનાવવી.'},
 {emoji:'🍪',gu:'બિસ્કિટ',en:'Biscuit',answer:'sometimes',why:'ઘણાં મીઠાં બિસ્કિટમાં ખાંડ વધુ હોય છે.'},
 {emoji:'🍰',gu:'કેક',en:'Cake',answer:'sometimes',why:'કેક ઉજવણીમાં ક્યારેક ખાઈ શકાય.'},
 {emoji:'🍦',gu:'આઇસક્રીમ',en:'Ice cream',answer:'sometimes',why:'આઇસક્રીમ મીઠાઈ છે; મર્યાદામાં ખાવું.'}
];
const $=id=>document.getElementById(id), numerals=n=>String(n).replace(/\d/g,d=>'૦૧૨૩૪૫૬૭૮૯'[d]);let deck=[],index=0,points=0,answered=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){deck=shuffle(foods.filter(x=>x.answer==='daily')).slice(0,6).concat(shuffle(foods.filter(x=>x.answer==='sometimes')).slice(0,6));shuffle(deck);index=0;points=0;$('finish').classList.add('hidden');$('play').classList.remove('hidden');show()}
function show(){answered=false;const f=deck[index];$('emoji').textContent=f.emoji;$('name').textContent=f.gu;$('english').textContent=f.en;$('count').textContent=`પ્રશ્ન ${numerals(index+1)} / ${numerals(deck.length)}`;$('score').textContent=`સ્કોર: ${numerals(points)}`;$('bar').style.width=`${index/deck.length*100}%`;$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden');document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=false)}
function choose(answer){if(answered)return;answered=true;const f=deck[index],ok=answer===f.answer;if(ok)points++;$('score').textContent=`સ્કોર: ${numerals(points)}`;$('feedback').textContent=(ok?'સાચો જવાબ! 🌟 ':'ફરી શીખીએ! 💡 ')+f.why;$('feedback').classList.add(ok?'correct':'wrong');document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);$('next').textContent=index===deck.length-1?'પરિણામ જુઓ ➜':'આગળનું ➜';$('next').classList.remove('hidden')}
document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.answer)));$('next').addEventListener('click',()=>{index++;if(index<deck.length)show();else{$('play').classList.add('hidden');$('finish').classList.remove('hidden');$('bar').style.width='100%';$('stars').textContent=points>=10?'⭐⭐⭐':points>=7?'⭐⭐':'⭐';$('final').textContent=`તમારો સ્કોર: ${numerals(points)} / ${numerals(deck.length)}. ફરી રમીને વધુ શીખો!`}});$('restart').addEventListener('click',start);start();
</script></body></html>
