/* ================================================

:root {
 --ink:#f7dfa2; --mute:#d7be85; --accent:#efc56c; --accent2:#24a38f;
 --light:#143f39; --focus:#ffe19c; --gold:#f6d27a; --gold-pale:#fff1c0;
 --line:rgba(235,190,99,.44); --forest-card:#0c3833;
}
html {background:#062b27}
body{color:var(--ink);background:radial-gradient(ellipse at 50% -14%,#176b5b 0%,#0b4038 37%,#052722 82%,#041d1c 100%);}
body::before{position:fixed;z-index:0;background:radial-gradient(circle at 46% 16%,rgba(235,191,98,.13),transparent 39%),radial-gradient(circle at 65% 85%,rgba(16,117,104,.23),transparent 52%)}
.forest-backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.88}
.forest-scene{width:100%;height:100%;display:block;opacity:.96}
.shell{position:relative;z-index:1}
.drift-leaf{position:absolute;top:-10%;left:var(--lx);height:17px;width:10px;display:block;opacity:0;background:linear-gradient(145deg,#b6a352,#306e47);border-radius:100% 0 100% 0;box-shadow:0 0 11px #e8c67d44;transform-origin:bottom right;animation:leaf-drift var(--dur) linear infinite;animation-delay:var(--delay)}
.leaf-a{--lx:9%;--dur:21s;--delay:-10s}.leaf-b{--lx:87%;--dur:18s;--delay:-2s}.leaf-c{--lx:71%;--dur:25s;--delay:-15s}.leaf-d{--lx:22%;--dur:27s;--delay:-23s}.leaf-e{--lx:94%;--dur:24s;--delay:-17s}.leaf-f{--lx:41%;--dur:28s;--delay:-8s}
@keyframes leaf-drift{0%{top:-10%;opacity:0;transform:translate(0,0) rotate(0)}8%{opacity:.68}70%{opacity:.56}100%{top:110%;opacity:0;transform:translate(95px,0) rotate(660deg)}}
.top{height:85px}.brand{color:var(--gold-pale);text-shadow:0 2px 12px #061c18;font-size:16px}.brand small{color:#d5bd7c!important}.logo{background:linear-gradient(140deg,#062c3c,#117b70);border:1.5px solid #e6bd6f;box-shadow:0 0 0 4px #d2a44c20,0 8px 19px #0006;font-size:25px}
.top-stats{color:var(--gold-pale)}.chipbtn{background:linear-gradient(135deg,#124b41ee,#082f2be8);border:1px solid var(--line);color:var(--gold-pale);box-shadow:0 4px 12px #021e1c66}.chipbtn:hover{background:#216b5b;color:#ffedb5}

.hero::before{inset:-132px -135px auto auto;width:430px;height:430px;border:1px solid #eecb6b33;background:repeating-radial-gradient(circle at center,transparent 0 21px,#ffe4a915 22px 23px,transparent 24px 41px);opacity:.73}
.hero::after{content:"";position:absolute;inset:auto auto -72px -45px;width:232px;height:170px;pointer-events:none;background:radial-gradient(ellipse,#22a88e44,transparent 70%);opacity:.6}
.hero>div:first-child{z-index:2;position:relative}.eyebrow{color:#ffe0a1;background:rgba(8,49,46,.9);border:1px solid #dab46577;box-shadow:0 4px 15px #061e1970}
.hero h1{color:#ffe4a3;text-shadow:0 3px 20px rgba(0,0,0,.35),0 0 14px #ddad3920;font-weight:900;letter-spacing:.2px}.hero p{color:#f0d79b}
.pill{color:#ffe5a3;background:#073e36d4;border-color:#d5a95279;box-shadow:inset 0 1px #fff2c618}
.hero-art{z-index:1;isolation:isolate}.peacock-emblem{width:min(100%,340px);height:auto;aspect-ratio:380/284;display:flex;align-items:center;justify-content:center;animation:float 5.8s ease-in-out infinite;filter:drop-shadow(0 8px 9px #0007)}.peacock-emblem svg{width:100%;height:100%;overflow:visible}
.orbiticon{filter:drop-shadow(0 2px 5px #000b)}
.overview h2,.subhead{color:var(--gold-pale);text-shadow:0 2px 13px #020d0b}.overview small,.backbar span{color:var(--mute)}
.lesson{border:1px solid #cba35585;background:linear-gradient(155deg,#124e43 0%,#0b332f 73%,#082924 100%);box-shadow:0 9px 26px #0008;color:var(--gold-pale)}
.lesson:hover{box-shadow:0 16px 35px #020d0ad9;border-color:#ffdf85;transform:translateY(-4px)}
.lesson-art{background:linear-gradient(135deg,rgba(3,44,43,.32),rgba(5,49,43,.70)),linear-gradient(130deg,var(--c1),var(--c2));border-bottom:1.5px solid #dfbc7888}
.lesson-art:before{border-color:#ffe09d32}.lesson-art:after{background:#f9df8f25}
.lesson-num{background:#07372ee8;color:#ffe6a0;border:1px solid #e9c474a8;box-shadow:0 3px 10px #001b1860}
.lesson-info h3{color:#ffdf91}.lesson-info strong{color:#f0ce80}.lesson-info p{color:#e2cf9f}.lesson-foot{color:#f6d48c}
.levelbar{background:#09211f;border:1px solid #bb94424f}.levelbar span{background:linear-gradient(90deg,#c68f38,#ffe7a2,#39ad91)}

function basePlay(clue,question,body){const l=LESSONS[currentLesson],m=MODES[currentGame];theme(currentLesson);app.innerHTML=`<div class="backbar"><button id="backGames" class="chipbtn">← પાઠની ગેમ્સ</button><span>${m.icon} ${escapeH(gameName(currentLesson,currentGame))} • ${escapeH(l.codes[currentGame])}</span></div><section class="play-zone"><div class="world" style="min-height:98px;padding:15px 20px;margin-bottom:15px"><div class="world-title"><span class="world-badge">${escapeH(l.title)}</span><h1 style="font-size:21px;margin:6px 0">${escapeH(gameName(currentLesson,currentGame))}</h1></div><div class="world-emojis" style="font-size:55px">${SCENES[currentLesson][1]}</div></div><div class="play-card"><div class="progress-info"><span>પ્રશ્ન ${round+1} / ૧૦</span><span>⭐ ${score} / ૧૦૦ ગુણ</span></div><div class="meter"><div class="meter-fill" style="width:${round*10}%"></div></div><p class="question">${question}</p>${clue}${body}<div id="feedbackContainer" aria-live="assertive"></div><div class="actions" id="roundActions"><button class="btn-secondary" id="retryBtn" style="display:none">🔁 આ પ્રશ્ન ફરી કરો</button><button class="btn-primary" id="nextBtn" style="display:none">આગળ વધો →</button></div></div></section>`;$('#backGames').onclick=()=>{view='lesson';render()};}
function current(){return items[round]}
function nextRound(){if(round>=10){finishGame();return}renderQuestion()}
function renderQuestion(){let mode=MODES[currentGame].type,item=current();if(!item){items=sample(LESSONS[currentLesson].rows,10);item=current()}if(mode==='visual')return visualQuestion(item);if(mode==='meaning')return meaningQuestion(item);if(mode==='pairs')return pairQuestion(item);if(mode==='order')return orderQuestion(item);return tfQuestion(item)}
function options(correct,pool){const wrong=sample([...new Set(pool.filter(x=>x!==correct))],3);return rand([correct,...wrong])}
function enableOptions(correct,kind){app.querySelectorAll('.answer[data-val]').forEach(b=>{b.onclick=()=>{if($('#nextBtn').style.display!=='none')return;let right=b.dataset.val===correct;app.querySelectorAll('.answer[data-val]').forEach(x=>{x.disabled=true;if(x.dataset.val===correct)x.classList.add('correct')});if(!right)b.classList.add('wrong');resolve(right,kind,correct)}})}
function resolve(right,kind,correct){if(right){score+=10;popConfetti();soundSuccess()}else soundFail();history.push(right);$('#feedbackContainer').innerHTML=`<div class="feedback ${right?'ok':'no'}">${right?'✅ શાબાશ! સાચો જવાબ.':'💡 સારો પ્રયત્ન! સાચો જવાબ: '+escapeH(correct)}</div>`;let next=$('#nextBtn');next.style.display='inline-block';next.textContent=round===9?'🏆 પરિણામ જુઓ':'આગળ વધો →';next.onclick=()=>{round++;nextRound()};}
function visualQuestion(it){let l=LESSONS[currentLesson];let special=currentLesson===7?clockFromGu(it.gu):currentLesson===6?fruitClue(it):`<div class="clue big">${escapeH(it.emoji)}</div>`;basePlay(special,`આ સંકેત અથવા અર્થ માટે યોગ્ય સંસ્કૃત શબ્દ પસંદ કરો.`,`<div class="hint">${escapeH(it.gu)}</div><div class="answers">${options(it.sa,l.rows.map(r=>r.sa)).map(s=>`<button class="answer" data-val="${escapeH(s)}">${escapeH(s)}</button>`).join('')}</div>`);enableOptions(it.sa,'visual')}
function meaningQuestion(it){let l=LESSONS[currentLesson];basePlay(`<div class="clue">${escapeH(it.sa)}</div>`,`આ સંસ્કૃત શબ્દનો યોગ્ય ગુજરાતી અર્થ પસંદ કરો.`,`<div class="answers">${options(it.gu,l.rows.map(r=>r.gu)).map(s=>`<button class="answer" data-val="${escapeH(s)}">${escapeH(s)}</button>`).join('')}</div>`);enableOptions(it.gu,'meaning')}
function pairQuestion(it){const l=LESSONS[currentLesson];const picks=[it,...sample(l.rows.filter(r=>r.sa!==it.sa),2)];const left=rand(picks),right=rand(picks);matchState={left:null,right:null,matched:new Set()};basePlay('<div class="hint">ત્રણ સાચી જોડીઓ શોધો. પહેલો ડાબો શબ્દ અને પછી જમણો અર્થ પસંદ કરો.</div>','શબ્દ અને અર્થની જોડીઓ બનાવો.',`<div class="pair-head"><span>संस्कृतम्</span><span>ગુજરાતી</span></div><div class="pair-cols"><div class="pair-col">${left.map(r=>`<button class="answer" data-side="left" data-key="${escapeH(r.sa)}">${escapeH(r.sa)}</button>`).join('')}</div><div class="pair-col">${right.map(r=>`<button class="answer" data-side="right" data-key="${escapeH(r.sa)}">${escapeH(r.gu)}</button>`).join('')}</div></div><div class="hint" id="pairMsg">૦/૩ જોડીઓ</div>`);app.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{if($('#nextBtn').style.display!=='none'||b.classList.contains('matched'))return;const side=b.dataset.side;app.querySelectorAll('[data-side="'+side+'"]:not(.matched)').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');matchState[side]=b;if(matchState.left&&matchState.right){let rightMatch=matchState.left.dataset.key===matchState.right.dataset.key;if(rightMatch){const key=matchState.left.dataset.key;matchState.matched.add(key);app.querySelectorAll('[data-key="'+CSS.escape(key)+'"]').forEach(x=>{x.classList.add('matched');x.classList.remove('selected');x.disabled=true});$('#pairMsg').textContent=`✅ ${matchState.matched.size}/૩ જોડીઓ`;if(matchState.matched.size===3)resolve(true,'pairs','બધી જોડીઓ સાચી');}else{soundFail();$('#pairMsg').textContent='ફરી પ્રયત્ન કરો: જોડી સાચી નથી.';matchState.left.classList.remove('selected');matchState.right.classList.remove('selected')}matchState.left=null;matchState.right=null}});}
function orderQuestion(it){let phrase=it.sentence.replace(/[।॥]/g,'').trim().split(/\s+/).filter(Boolean);if(phrase.length<2)phrase=[it.sa,'।'];let scrambled=rand(phrase.map((s,i)=>({s,i})));if(scrambled.every((x,i)=>x.i===i))scrambled.reverse();chosen=[];basePlay(`<div class="clue" style="font-size:21px">${escapeH(it.gu)}</div>`,'આ શબ્દોને યોગ્ય ક્રમમાં ગોઠવો.',`<div class="builder-line" id="builderLine"></div><div class="hint">નીચેના શબ્દોને એક પછી એક સ્પર્શ કરો.</div><div class="builder-choices">${scrambled.map(o=>`<button class="wordbtn" data-tok="${o.i}">${escapeH(o.s)}</button>`).join('')}</div><div class="actions"><button class="btn-secondary" id="clearOrder">↺ ફરી ગોઠવો</button><button class="btn-primary" id="checkOrder">✓ જવાબ ચકાસો</button></div>`);let line=$('#builderLine');let btns=app.querySelectorAll('[data-tok]');function draw(){line.innerHTML=chosen.map((x,k)=>`<button class="wordbtn" data-remove="${k}">${escapeH(x.s)}</button>`).join('');line.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let [x]=chosen.splice(+b.dataset.remove,1);app.querySelector('[data-tok="'+x.i+'"]').classList.remove('used');draw()})}btns.forEach(b=>b.onclick=()=>{if($('#nextBtn').style.display!=='none')return;let obj=scrambled.find(x=>String(x.i)===b.dataset.tok);if(chosen.some(x=>x.i===obj.i))return;chosen.push(obj);b.classList.add('used');draw()});$('#clearOrder').onclick=()=>{chosen=[];btns.forEach(b=>b.classList.remove('used'));draw()};$('#checkOrder').onclick=()=>{if(!chosen.length)return;let correct=chosen.length===phrase.length&&chosen.every((x,i)=>x.i===i);btns.forEach(b=>b.disabled=true);$('#checkOrder').disabled=true;$('#clearOrder').disabled=true;resolve(correct,'order',phrase.join(' ')+' ।')};}
function tfQuestion(it){const l=LESSONS[currentLesson],isCorrect=(round%2===0);let gu=isCorrect?it.gu:sample(l.rows.filter(r=>r.sa!==it.sa&&r.gu!==it.gu),1)[0].gu;basePlay(`<div class="clue">${escapeH(it.sa)}<div style="font-size:25px;color:#9d90ac">↔</div>${escapeH(gu)}</div>`,'આ સંસ્કૃત શબ્દ અને ગુજરાતી અર્થની જોડી સાચી છે?',`<div class="answers"><button class="answer" data-val="હા">✅ સાચું</button><button class="answer" data-val="ના">❌ ખોટું</button></div>`);enableOptions(isCorrect?'હા':'ના','truefalse')}
function fruitClue(it){const fruit=it.emoji;let n=LESSONS[6].rows.indexOf(it)+1;return `<div class="game-illustration" style="font-size:29px">${fruit.repeat(n)}</div><div class="hint">ફળોની સંખ્યા: ${n} • ${escapeH(it.gu)}</div>`}
function clockFromGu(gu){const mm=gu.match(/^(\d{1,2}):(\d\d)/);if(!mm)return `<div class="clue big">⏰</div>`;let h=+mm[1],m=+mm[2];let numbers=Array.from({length:12},(_,i)=>{let a=(i+1)*Math.PI/6,x=81*Math.sin(a),y=-81*Math.cos(a);return `<span class="clocknum" style="transform:translate(calc(-50% + ${x*.84}px),calc(-50% + ${y*.84}px))">${i+1}</span>`}).join('');return `<div class="clock" aria-label="સમય ${h}:${String(m).padStart(2,'0')}">${numbers}<div class="clockhand hour" style="transform:rotate(${(h%12)*30+m*.5}deg)"></div><div class="clockhand minute" style="transform:rotate(${m*6}deg)"></div><div class="clockcenter"></div></div>`}
function finishGame(){let key=currentLesson+'_'+currentGame;let s=saved[key]||{};saved[key]={completed:true,best:Math.max(s.best||0,score),last:score,plays:(s.plays||0)+1};store();view='end';render();}
function endScreen(){const l=LESSONS[currentLesson],m=MODES[currentGame];theme(currentLesson);let count=history.filter(Boolean).length;app.innerHTML=`<div class="backbar"><button class="chipbtn" id="goBackEnd">← પાંચ ગેમ્સ</button><span>🏆 પાઠ ${currentLesson+1}નું પરિણામ</span></div><section class="play-zone"><div class="play-card score-screen"><div class="trophy">${score>=80?'🏆':score>=50?'🌟':'📚'}</div><h2>${score>=80?'અદ્ભુત! શાબાશ!':score>=50?'ખૂબ સરસ પ્રયત્ન!':'ફરી અભ્યાસ કરીએ!'}</h2><p><strong>${escapeH(l.title)}</strong> — ${escapeH(gameName(currentLesson,currentGame))}</p><div class="stat">${score} / 100</div><div class="pill-row" style="justify-content:center"><span class="pill">✅ ${count} સાચા</span><span class="pill">💡 ${10-count} સુધારવાની તક</span><span class="pill">🎮 ${doneCount(currentLesson)}/5 ગેમ્સ પૂર્ણ</span></div><div class="actions"><button class="btn-primary" id="replay">🔄 ફરી રમો</button><button class="btn-secondary" id="endLesson">📚 આગળની ગેમ</button></div><div class="result-box" id="certArea"><h2>🌸 संस्कृत अध्ययन प्रमाणपत्रम् 🌸</h2><p>શ્રી કેરા કન્યા પ્રાથમિક શાળા</p><p>આ પ્રમાણપત્ર આપવામાં આવે છે કે</p><input class="name-input" id="studentName" placeholder="વિદ્યાર્થીનું નામ લખો" maxlength="90" aria-label="વિદ્યાર્થીનું નામ" value="${escapeH(player)}"><p><strong>${escapeH(l.title)}</strong> પાઠની <strong>${escapeH(gameName(currentLesson,currentGame))}</strong> ગેમ સફળતાપૂર્વક પૂર્ણ કરી છે.</p><h3 style="color:var(--accent)">${score} / 100 ગુણ</h3><p>${new Date().toLocaleDateString('en-GB')}<br>Created by Krishna R. Budhabhatti</p></div><button class="btn-secondary" id="printCert">🖨️ પ્રમાણપત્ર પ્રિન્ટ કરો</button></div></section>`;$('#replay').onclick=()=>openGame(currentGame);$('#endLesson').onclick=()=>openLesson(currentLesson);$('#goBackEnd').onclick=()=>openLesson(currentLesson);$('#studentName').oninput=e=>{player=e.target.value};$('#printCert').onclick=()=>{player=$('#studentName').value;window.print()};}
function popConfetti(){for(let i=0;i<9;i++){let e=document.createElement('span');e.className='confetti';e.textContent=['⭐','✨','🎊','🌸','💫'][i%5];e.style.setProperty('--dx',`${(Math.random()-.5)*350}px`);e.style.left=`${32+Math.random()*38}%`;document.body.append(e);setTimeout(()=>e.remove(),800)}}
function say(text){if(!sound||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='hi-IN';u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function soundSuccess(){say('शाबाश')};function soundFail(){say('पुनः प्रयत्नं कुरु')}
$('#soundToggle').onclick=()=>{sound=!sound;$('#soundToggle').textContent=sound?'🔊 અવાજ':'🔇 અવાજ';if(sound) say('नमस्ते')};render();
</script></body></html>
