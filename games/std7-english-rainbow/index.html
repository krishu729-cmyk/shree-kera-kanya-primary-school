 out+=`<div class="questionblock"><p class="qcount">YOUR WRITING • 5 MARKS</p><p class="prompt">${q===12?'Write a paragraph in 5–7 sentences.':'Observe the poster. Write five meaningful English sentences.'}</p><textarea class="writing" data-field="writing" placeholder="Type your answer here ..." ${done?'readonly':''}>${E(s.writing||'')}</textarea><div class="rubric">📏 મૂલ્યાંકન માપદંડ: વિષય અને માહિતી – 2 ગુણ · સાચાં વાક્યો અને વ્યાકરણ – 2 ગુણ · જોડણી અને વિરામચિહ્ન – 1 ગુણ. જવાબ શિક્ષક ચકાસે પછી જ આ ગુણ ઉમેરાશે.</div>${done?`<div class="resultline correct"><b>Example answer (માર્ગદર્શન માટે):</b><p>${E(c.model)}</p></div><p class="muted">${E(c.source)}</p>${ST.teacher?`<label>👩‍🏫 શિક્ષકે આપેલા ગુણ (0–5): <select class="answerselect" id="teacherMark"><option value="">હજુ મૂલ્યાંકન નથી</option>${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${Number(ST.teacherScores[act.id])===n&&ST.teacherScores[act.id]!==undefined?'selected':''}>${n} / 5</option>`).join('')}</select></label>`:'<p class="muted">🔒 શિક્ષક મૂલ્યાંકન ચાલુ કરીને 0–5 ગુણ આપી શકે છે.</p>'}`:''}</div>`;return out}
 let out='';c.forEach((it,i)=>{
  let target='',ok=false,inner='',pt=q===9||q===10?2:1;
  if(q===1||q===2){target=it[1];ok=clean(s['a'+i])===clean(target);inner=`<p class="prompt">${E(it[0])}</p>${field(act,i,q===1?['and','but','yet','or','so']:['can','may','should','must'])}`}
  if(q===3){target=it;let words=it.split(/\s+/),taken=s['w'+i]||[],formed=taken.map(n=>words[n]).join(' ');ok=clean(formed)===clean(target);let indices=shuffled(words.map((w,idx)=>idx),i*23+act.unit*97+33);inner=`<p class="prompt muted">શબ્દો પર ક્લિક કરીને સાચું વાક્ય બનાવો.</p><div class="tilearea tilebox" aria-label="Chosen words">${taken.map((n,ix)=>`<button type="button" class="tile chosen" data-remove="${i}:${ix}" ${done?'disabled':''}>${E(words[n])} ×</button>`).join('')||'<span class="muted">અહીં તમારું વાક્ય બનશે …</span>'}</div><div class="tilebox">${indices.map(n=>`<button type="button" class="tile ${taken.includes(n)?'used':''}" data-tile="${i}:${n}" ${done||taken.includes(n)?'disabled':''}>${E(words[n])}</button>`).join('')}</div>${!done?`<button type="button" class="mini" data-clear="${i}" style="margin-top:10px">↻ Reset sentence</button>`:''}`}
  if(q===4){target=it[1];ok=clean(s['a'+i])===clean(target);inner=`<p class="prompt">${E(it[0])}</p>${field(act,i,it.slice(1))}`}
  if(q===5){target=it[1];ok=(s['a'+i]||'').trim().replace(/\s+/g,' ').replace(/’/g,"'")===target;inner=`<p class="prompt">${E(it[0])}</p>${textfield(act,'a'+i,'Write correct sentence (capital letters and punctuation)')}`}

  if(q===9){let qok=clean(s['q'+i])===clean(it[2]),aok=clean(s['a'+i])===clean(it[3]);ok=qok&&aok;inner=`<p class="fact">Situation: ${E(it[0])}</p><p class="muted">Clues: ${E(it[1])}</p><div class="twocol"><label class="muted">1. Make a Yes/No question (1 mark)${textfield(act,'q'+i,'Write the question')}</label><label class="muted">2. Give the answer (1 mark)${textfield(act,'a'+i,'Yes / No answer')}</label></div>${done?`<div class="resultline ${qok?'correct':'wrong'}">${qok?'✓':'✕'} Question: ${E(it[2])}</div><div class="resultline ${aok?'correct':'wrong'}">${aok?'✓':'✕'} Answer: ${E(it[3])}</div>`:''}`}
  if(q===10){target=it[1];ok=clean(s['a'+i])===clean(target);inner=`<p class="prompt">${E(it[0])}</p>${field(act,i,[it[1],it[2]],'Choose the correct Yes/No reply')}`}

 });return out}
function chart(c){const W=730,H=312,pl=70,pr=20,top=22,base=257,h=220;let all=c.series.flatMap(s=>s.values),max=Math.max(5,Math.ceil(Math.max(...all)/5)*5),step=max/5;let cols=c.cats.length,sn=c.series.length,cw=(W-pl-pr)/cols,barW=Math.min(42,cw/(sn+1.4));let svg=`<svg class="chart" role="img" aria-label="${E(c.title)}: ${c.cats.map((k,i)=>`${k}: ${c.series.map(s=>s.label+' '+s.values[i]).join(', ')}`).join('; ')}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><rect width="730" height="312" fill="#e9f0ff" rx="11"/>`;
 for(let k=0;k<=5;k++){let v=Math.round(step*k*10)/10,y=base-v/max*h;svg+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#9da9c1" stroke-width="1"/><text x="${pl-12}" y="${y+4}" text-anchor="end" font-size="13" fill="#243b5a">${v}</text>`}
 c.cats.forEach((cat,i)=>{let cx=pl+(i+.5)*cw;svg+=`<text x="${cx}" y="${base+23}" text-anchor="middle" font-size="13" fill="#263e5c">${E(cat)}</text>`;c.series.forEach((s,j)=>{let value=s.values[i],bx=cx+(j-(sn-1)/2)*barW*1.15-barW/2,y=base-value/max*h;svg+=`<rect x="${bx}" y="${y}" width="${barW}" height="${base-y}" rx="4" fill="${s.color}" stroke="#33526c" stroke-width=".8"/><text x="${bx+barW/2}" y="${y-6}" text-anchor="middle" font-size="11" fill="#243752">${value}</text>`})});return `<div class="graphbox">${svg}</svg><div class="legend">${c.series.map(s=>`<span><b style="background:${s.color}"></b>${E(s.label)}</span>`).join('')}</div></div>`}
function poster(c){return `<div class="poster" role="img" aria-label="Poster ${E(c.title)} with messages: ${E(c.messages.join(', '))}"><div>🌈 COMMUNITY AWARENESS 🌈</div><h3>${E(c.title)}</h3><h4>${E(c.sub)}</h4><div class="posterIcons">${c.icons.map(i=>`<span>${i}</span>`).join('')}</div><div class="posterPoints">${c.messages.map(m=>`<span>✓ ${E(m)}</span>`).join('')}</div></div>`}
function renderPlay(){if(ST.screen!=='play')return;const act=A(ST.playlist[ST.index]),t=totals(),m=ST.playlist.length,sc=scoreFor(act);let side=ST.playlist.map((id,i)=>{let a=A(id),done=ST.submitted[id],v=scoreFor(a);return `<button class="sideact ${i===ST.index?'current':''} ${done?'done':''}" data-go="${i}"><span class="bullet">${done?'✓':i+1}</span><span>Q${a.q} · ${E(a.title)}<br><small>${E(U(a.unit).name.slice(0,19))}</small></span><small>${v===null?'…':v}/${a.marks}</small></button>`}).join('');let source=act.q>=12?act.content.source:act.q===6?act.content.page:act.q===11?act.content.note:`Unit ${act.unit} · ${U(act.unit).name} · Newly prepared textbook-themed practice`;
 $('#app').innerHTML=`<section class="hero"><div><span class="eyebrow">🌈 LEVEL ${ST.index+1} OF ${m}</span><h2 style="font-size:clamp(25px,4vw,46px)">${ST.mode==='question'?'Question Type Practice':ST.mode==='unit'?'Chapter Adventure':'80-Mark Practice Quest'} <span class="rainbow-text">${ST.mode==='question'?`Q${act.q}`:`Set ${act.set}`}</span></h2><p>🌧️ તમારો પ્રયત્ન ચાલુ રાખો! દરેક સાચો જવાબ મેઘધનુષ્યમાં નવો રંગ ભરે છે.</p></div><div class="heroStats"><div class="stat"><b>${t.scored}</b><span>પ્રાપ્ત ગુણ</span></div><div class="stat"><b>${t.max}</b><span>કુલ ગુણ</span></div><div class="stat"><b>${t.finished}/${t.count}</b><span>પૂર્ણ પ્રવૃત્તિ</span></div><div class="stat"><b>${t.pending}</b><span>ચકાસવાના ગુણ</span></div></div></section><div class="playlayout"><aside class="side panel"><p class="sidehead">🗺️ Adventure map • પ્રવૃત્તિઓ</p>${side}</aside><section class="panel gamepanel"><div class="gameTop"><span class="crumb">${U(act.unit).emoji} UNIT ${act.unit}: ${E(U(act.unit).name)} / Q${act.q} / ${act.set}</span><span class="pill">🎯 LO ${act.lo} · ${act.marks} ગુણ ${sc!==null?'· મળ્યા '+sc:''}</span></div><h2 class="activityTitle">${act.icon} ${E(act.title)}</h2><p class="activityDesc">${E(source)}</p><div class="pbar"><i style="width:${Math.round(100*t.finished/t.count)}%"></i></div>${act.q===9?'<div class="hint">દરેક સાચા પ્રશ્નને 1 ગુણ અને તેના સાચા જવાબને 1 ગુણ મળશે. Spelling અને grammar તપાસો.</div>':act.q===3?'<div class="hint">🧩 નીચેના શબ્દોને યોગ્ય ક્રમમાં ગોઠવો. શબ્દને કાઢવા બનેલા વાક્યમાં તેના પર ટૅપ કરો.</div>':''}${renderQuestions(act)}<div class="actions"><div class="actionGroup"><button class="btn secondary" id="backAct" ${ST.index===0?'disabled':''}>← પાછલું</button><button class="btn secondary" id="clearAct" ${ST.submitted[act.id]?'disabled':''}>↻ ફરી ગોઠવો</button></div><div class="actionGroup"><button class="btn gold" id="checkAct" ${ST.submitted[act.id]?'disabled':''}>${ST.submitted[act.id]?'✅ જવાબ તપાસ્યા':'✨ જવાબ ચકાસો'}</button><button class="btn primary" id="nextAct">${ST.index===m-1?'🏆 પરિણામ જુઓ':'આગળ →'}</button></div></div><p class="muted" style="margin-top:13px">🔍 નોંધ: આ પ્રવૃત્તિની માહિતી સંગ્રહિત રહેશે. ચકાસ્યા પછી સુધારેલો જવાબ જોવા મળશે.</p></section></div>`;
 $$('[data-go]').forEach(b=>b.onclick=()=>{ST.index=Number(b.dataset.go);renderPlay();scrollUp()});$('#backAct').onclick=()=>{ST.index--;renderPlay();scrollUp()};$('#nextAct').onclick=()=>{if(ST.index===m-1){ST.screen='results';renderResults()}else{ST.index++;renderPlay()}scrollUp()};$('#checkAct').onclick=()=>{ST.submitted[act.id]=true;save();const value=scoreFor(act);beep(value===act.marks);toast(act.q>=12?'📝 જવાબ સાચવ્યો. શિક્ષક ગુણ આપશે.':`🌟 ${value} / ${act.marks} ગુણ · સાચા જવાબો બતાવ્યા છે.`);renderPlay()};$('#clearAct').onclick=()=>{ST.responses[act.id]={};save();renderPlay();toast('ફરીથી પ્રયત્ન કરી શકો છો')};
 $$('[data-field]').forEach(el=>{const listener=()=>{responseObj(act.id)[el.dataset.field]=el.value;save()};el.addEventListener(el.tagName==='INPUT'||el.tagName==='TEXTAREA'?'input':'change',listener)});
 $$('[data-tile]').forEach(b=>b.onclick=()=>{let [i,n]=b.dataset.tile.split(':').map(Number);let s=responseObj(act.id),k='w'+i;if(!s[k])s[k]=[];if(!s[k].includes(n))s[k].push(n);save();renderPlay()});$$('[data-remove]').forEach(b=>b.onclick=()=>{let [i,n]=b.dataset.remove.split(':').map(Number);let s=responseObj(act.id);(s['w'+i]||[]).splice(n,1);save();renderPlay()});$$('[data-clear]').forEach(b=>b.onclick=()=>{responseObj(act.id)['w'+b.dataset.clear]=[];save();renderPlay()});const tm=$('#teacherMark');if(tm)tm.onchange=()=>{if(tm.value==='')delete ST.teacherScores[act.id];else ST.teacherScores[act.id]=Number(tm.value);save();toast('શિક્ષક ગુણ સાચવાયા');renderPlay()};
 }
function renderResults(){ST.screen='results';const t=totals(),pct=t.max?Math.round(100*t.scored/t.max):0,pending=t.count-t.finished;let teamA=0,teamB=0;ST.playlist.forEach((id,i)=>{const p=scoreFor(A(id));if(p!==null){if(i%2===0)teamA+=p;else teamB+=p}});
 $('#app').innerHTML=hero()+`<section class="panel homepanel"><div class="resultHeader"><div class="huge">${t.finished===t.count?'🏆':'🌦️'}</div><h2>${t.finished===t.count?'શાનદાર! તમારો અભ્યાસ પૂર્ણ થયો.':'તમારી પ્રગતિનો અહેવાલ'}</h2><div class="scoreHuge">${t.scored} / ${t.max}</div><p class="muted">આ સુધી મળેલા ગુણ ${pct}% · ${t.pending?`${t.pending} ગુણ શિક્ષક ચકાસવાના બાકી છે.`:'લેખન મૂલ્યાંકન બાકી નથી.'}</p></div><div class="resultsGrid"><div class="resultStat"><strong>${t.finished}/${t.count}</strong><span>પ્રવૃત્તિ પૂર્ણ</span></div><div class="resultStat"><strong>${t.scored}</strong><span>ચકાસેલા ગુણ</span></div><div class="resultStat"><strong>${t.pending}</strong><span>શિક્ષક ચકાસે તેવા ગુણ</span></div></div>${ST.teamMode?`<div class="notice">👫 ટીમ પ્રમાણે વૈકલ્પિક સરવાળો (ક્રમ મુજબ): Team A – ${teamA} ગુણ · Team B – ${teamB} ગુણ. આ વ્યક્તિગત બ્લૂપ્રિન્ટ સ્કોરથી અલગ છે.</div>`:''}<h3>📋 Learning Outcome Report</h3><div class="reportList">${ST.playlist.map((id,i)=>{let a=A(id),v=scoreFor(a);return `<div class="reportrow"><span>${a.icon} Q${a.q} • ${E(a.lo)} • ${E(a.title)}</span><b>${v===null?'બાકી':`${v}/${a.marks}`}</b><button class="mini" data-review="${i}">ખોલો</button></div>`}).join('')}</div>${t.finished===t.count&&t.pending===0?`<div class="certificate"><div style="font-size:43px">🌈 🏆 🌈</div><h2>CERTIFICATE OF ENGLISH ADVENTURE</h2><div>આ સર્ટિફિકેટ આપવામાં આવે છે</div><div class="student">${E(ST.student||'Student')}</div><p>For completing ${ST.mode==='question'?'English Question Type Practice':'Std 7 English Rainbow Rain Quest'} with <b>${t.scored}/${t.max}</b> marks.</p><small>શ્રી કેરા કન્યા પ્રાથમિક શાળા • Created by Krishna R. Budhabhatti</small></div>`:`<div class="notice">✨ પ્રમાણપત્ર માટે બધી પ્રવૃત્તિ પૂર્ણ કરો અને શિક્ષક પાસેથી લખાણના ગુણ લેવડાવો.</div>`}<div class="actions"><button class="btn secondary" id="resultHome">🏠 હોમ</button><div class="actionGroup"><button class="btn secondary" id="resultPrint">🖨️ પ્રિન્ટ / સર્ટિફિકેટ</button><button class="btn primary" id="resultResume">✏️ પ્રવૃત્તિઓ ખોલો</button></div></div></section>`;
 $$('[data-review]').forEach(b=>b.onclick=()=>{ST.index=Number(b.dataset.review);ST.screen='play';renderPlay();scrollUp()});$('#resultHome').onclick=home;$('#resultResume').onclick=()=>{ST.screen='play';ST.index=Math.max(0,ST.playlist.findIndex(id=>!ST.submitted[id]));renderPlay();scrollUp()};$('#resultPrint').onclick=()=>window.print()}
