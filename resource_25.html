<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML + CSS + JS Playground</title>
<style>
body{margin:0;font-family:Arial;background:#202124;color:#fff}
header{padding:12px;background:#111;font-size:22px;font-weight:bold;text-align:center}
#editor{width:100%;height:45vh;background:#0d1117;color:#e6edf3;
border:none;outline:none;padding:12px;box-sizing:border-box;
font-family:Consolas,monospace;font-size:15px}
.controls{padding:10px;background:#2b2b2b}
button{padding:10px 16px;margin-right:8px;border:none;border-radius:8px;cursor:pointer}
iframe{width:100%;height:45vh;border:none;background:#fff}
</style>
</head>
<body>
<header>🚀 Single File HTML Generator / Playground</header>

<textarea id="editor"><!DOCTYPE html>
<html>
<head>
<style>
body{
  font-family:Arial;
  text-align:center;
  background:#f5f5f5;
}
h1{color:#1565c0;}
button{padding:10px 20px;}
</style>
</head>
<body>

<h1>Hello World</h1>
<p>HTML + CSS + JavaScript in ONE file.</p>

<button onclick="hello()">Click Me</button>

<script>
function hello(){
  alert("Hello from JavaScript!");
}
</script>

</body>
</html></textarea>

<div class="controls">
<button onclick="runCode()">▶ Run</button>
<button onclick="downloadCode()">⬇ Download</button>
<button onclick="resetCode()">🔄 Reset</button>
</div>

<iframe id="preview"></iframe>

<script>
const sample=document.getElementById("editor").defaultValue;

function runCode(){
  preview.srcdoc=document.getElementById("editor").value;
}
function downloadCode(){
 const code=document.getElementById("editor").value;
 const blob=new Blob([code],{type:"text/html"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="index.html";
 a.click();
}
function resetCode(){
 document.getElementById("editor").value=sample;
 runCode();
}
runCode();
</script>

</body>
</html>
