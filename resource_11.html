<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Educational Game Maker</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#243047;--muted:#6b7280;--primary:#5b5bd6;--ok:#18a66a;--bad:#e24a4a;--accent:#f5b942;--shadow:0 10px 30px rgba(27,31,59,.12)}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Gujarati","Shruti",Arial,sans-serif;background:linear-gradient(135deg,#f8fbff,#fff7ef);color:var(--text)}button,input,textarea,select{font:inherit}header{padding:18px 16px;background:#ffffffcc;backdrop-filter:blur(10px);position:sticky;top:0;z-index:9;border-bottom:1px solid #e9ebf2}.wrap{max-width:1180px;margin:auto}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#6c63ff,#44c2ff);color:#fff;font-size:25px;box-shadow:var(--shadow)}h1{font-size:clamp(20px,3vw,32px);margin:0}.sub{color:var(--muted);font-size:14px}main{padding:20px 14px 80px}.grid{display:grid;grid-template-columns:380px 1fr;gap:18px}.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow);border:1px solid #eef0f5}label{font-weight:700;font-size:14px;display:block;margin:10px 0 6px}input,textarea,select{width:100%;padding:11px 12px;border:1px solid #dfe3ec;border-radius:12px;background:#fbfcff;outline:none}textarea{min-height:88px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btnbar{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}button{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:var(--primary);color:#fff}.secondary{background:#edf0ff;color:#3d45ad}.good{background:#e6f8ef;color:#08794a}.danger{background:#ffe9e9;color:#b72c2c}.gold{background:#fff2cc;color:#7b5a00}.qitem{border:1px solid #e7e9ef;border-radius:16px;padding:12px;margin:10px 0;background:#fff}.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eff2ff;color:#555ec5;font-size:12px;font-weight:800}.preview{min-height:520px;background:linear-gradient(180deg,#f3f7ff,#fff);border-radius:20px;padding:18px;position:relative;overflow:hidden}.preview h2{text-align:center;margin:8px 0 3px}.scorebar{display:flex;justify-content:space-between;gap:10px;background:#fff;padding:10px 12px;border-radius:14px;margin:12px 0;box-shadow:0 5px 15px rgba(0,0,0,.06)}.question{background:#fff;padding:20px;border-radius:18px;box-shadow:var(--shadow);font-size:20px;font-weight:800;text-align:center}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.opt{background:#fff;border:2px solid #e7e9f3;padding:14px;border-radius:16px;transition:.2s}.opt:hover{transform:translateY(-2px);border-color:#9aa1ff}.correct{background:#def8ea!important;border-color:#27b06f!important}.wrong{background:#ffe1e1!important;border-color:#e55b5b!important}.center{text-align:center}.hidden{display:none!important}.big{font-size:48px}.tiny{font-size:12px;color:var(--muted)}.balloonArea{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;margin-top:20px}.balloon{width:120px;height:150px;border-radius:55% 55% 48% 48%;display:grid;place-items:center;text-align:center;padding:10px;background:radial-gradient(circle at 30% 25%,#fff,#ffd1dc 20%,#ff8db3 70%);box-shadow:0 10px 20px #ff8db344;font-weight:800;position:relative}.balloon:after{content:"";position:absolute;bottom:-12px;border:7px solid transparent;border-top-color:#ff8db3}.frogLane{position:relative;height:190px;margin-top:16px;background:linear-gradient(#d9f5ff 0 40%,#a7e58c 40% 100%);border-radius:18px;overflow:hidden}.frog{position:absolute;left:20px;bottom:25px;font-size:54px;transition:.35s}.lily{position:absolute;bottom:25px;width:110px;height:55px;background:#7fc96b;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;text-align:center;padding:5px}.teamgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.team{padding:14px;border-radius:16px;background:#fff;box-shadow:var(--shadow)}footer{padding:20px;text-align:center;color:#777}@media(max-width:850px){.grid{grid-template-columns:1fr}.options,.teamgrid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap brand"><div class="logo">🎮</div><div><h1>HTML Educational Game Maker</h1><div class="sub">તમારા પ્રશ્નો ઉમેરો • Game Mode પસંદ કરો • તરત રમો • JSON Export/Import</div></div></div></header>
<main class="wrap"><div class="grid">
<section class="card">
<h3>⚙️ Game Settings</h3><label>Game Title</label><input id="gameTitle" value="મારી શૈક્ષણિક રમત">
<div class="row"><div><label>Game Mode</label><select id="mode"><option value="mcq">MCQ Quiz</option><option value="tf">True / False</option><option value="fill">Fill in the Blank</option><option value="balloon">Balloon Pop</option><option value="frog">Frog Jump</option><option value="team">Two-Team Quiz</option></select></div><div><label>Shuffle</label><select id="shuffle"><option value="yes">Yes</option><option value="no">No</option></select></div></div>
<hr style="border:none;border-top:1px solid #eee;margin:18px 0"><h3>➕ Add Question</h3><label>Question</label><textarea id="qText" placeholder="પ્રશ્ન અહીં લખો..."></textarea>
<div class="row"><div><label>Option A</label><input id="a" placeholder="વિકલ્પ A"></div><div><label>Option B</label><input id="b" placeholder="વિકલ્પ B"></div><div><label>Option C</label><input id="c" placeholder="વિકલ્પ C"></div><div><label>Option D</label><input id="d" placeholder="વિકલ્પ D"></div></div>
<label>Correct Answer</label><select id="correct"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select>
<div class="btnbar"><button class="primary" onclick="addQuestion()">➕ પ્રશ્ન ઉમેરો</button><button class="secondary" onclick="addSample()">✨ Sample</button><button class="danger" onclick="clearAll()">🗑️ Clear</button></div>
<hr style="border:none;border-top:1px solid #eee;margin:18px 0"><div class="btnbar"><button class="good" onclick="exportJSON()">⬇️ Export JSON</button><button class="gold" onclick="document.getElementById('fileInput').click()">⬆️ Import JSON</button><input id="fileInput" type="file" accept=".json" hidden onchange="importJSON(event)"></div><div class="tiny" style="margin-top:10px">Single-file browser app. કોઈ external library જરૂરી નથી.</div>
</section>
<section class="card"><div class="qhead"><h3 style="margin:0">📚 Question Bank</h3><span class="badge" id="countBadge">0 Questions</span></div><div id="questionList"></div><div class="btnbar"><button class="primary" onclick="startGame()">▶️ Game Start</button></div><div id="gameArea" class="preview hidden"></div></section>
</div></main><footer>Made for classroom learning • Single-file HTML Game Maker</footer>
<script>
let questions=[],order=[],current=0,score=0,teamTurn=0,teamScores=[0,0];
function addQuestion(){const q=qText.value.trim(),opts=[a.value.trim(),b.value.trim(),c.value.trim(),d.value.trim()],ci=+correct.value;if(!q||!opts[0]||!opts[1])return alert('પ્રશ્ન અને ઓછામાં ઓછા 2 વિકલ્પ લખો.');const clean=opts.filter(x=>x);questions.push({q,options:clean,answer:Math.min(ci,clean.length-1)});qText.value='';a.value='';b.value='';c.value='';d.value='';renderList()}
function addSample(){questions=[{q:'પાણી બચાવવું કેમ જરૂરી છે?',options:['જીવન માટે','માત્ર રમવા માટે','રંગ માટે','કોઈ કારણ નથી'],answer:0},{q:'નળ ખુલ્લો રહી જાય તો શું કરવું?',options:['બંધ કરવો','વધુ ખોલવો','તોડી નાખવો','અવગણવું'],answer:0},{q:'વરસાદનું પાણી સાચવવાની રીત શું કહેવાય?',options:['Rainwater Harvesting','Water Wasting','Dry Farming','Air Saving'],answer:0},{q:'“Save Water, Save Life” નો અર્થ?',options:['પાણી બચાવો, જીવન બચાવો','પાણી વહાવો','પાણી ફેંકો','પાણી ભૂલી જાવ'],answer:0}];renderList()}
function renderList(){countBadge.textContent=questions.length+' Questions';questionList.innerHTML=questions.length?'':'<p class="tiny">હજુ પ્રશ્ન ઉમેર્યા નથી.</p>';questions.forEach((x,i)=>{const div=document.createElement('div');div.className='qitem';div.innerHTML=`<div class="qhead"><b>${i+1}. ${esc(x.q)}</b><button class="danger" onclick="delQ(${i})">✕</button></div><div class="tiny">${x.options.map((o,j)=>String.fromCharCode(65+j)+') '+esc(o)+(j===x.answer?' ✓':'')).join(' &nbsp; | &nbsp; ')}</div>`;questionList.appendChild(div)})}
function delQ(i){questions.splice(i,1);renderList()}function clearAll(){if(confirm('બધા પ્રશ્નો દૂર કરવા?')){questions=[];renderList();gameArea.classList.add('hidden')}}
function shuffleArr(arr){for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function startGame(){if(!questions.length)return alert('પહેલા પ્રશ્નો ઉમેરો.');current=0;score=0;teamTurn=0;teamScores=[0,0];order=questions.map((_,i)=>i);if(shuffle.value==='yes')shuffleArr(order);gameArea.classList.remove('hidden');renderGame();gameArea.scrollIntoView({behavior:'smooth'})}
function renderGame(){if(current>=order.length)return finishGame();const q=questions[order[current]],m=mode.value;gameArea.innerHTML=`<h2>${esc(gameTitle.value)}</h2><div class="scorebar"><span>Question: ${current+1}/${order.length}</span><span>Score: ${score}</span></div><div class="question">${esc(q.q)}</div><div id="playZone"></div>`;if(m==='balloon')renderBalloon(q);else if(m==='frog')renderFrog(q);else if(m==='team')renderTeam(q);else renderOptions(q,m)}
function renderOptions(q,m){let opts=q.options.map((o,i)=>({o,i}));if(shuffle.value==='yes')shuffleArr(opts);if(m==='tf'&&q.options.length>2)opts=opts.slice(0,2);playZone.innerHTML='<div class="options">'+opts.map(x=>`<button class="opt" onclick="answer(${x.i},this)">${esc(x.o)}</button>`).join('')+'</div>'}
function answer(i,el){const q=questions[order[current]];document.querySelectorAll('.opt').forEach(b=>b.disabled=true);if(i===q.answer){score++;el.classList.add('correct');beep(700)}else{el.classList.add('wrong');beep(220)}setTimeout(()=>{current++;renderGame()},700)}
function renderBalloon(q){let opts=q.options.map((o,i)=>({o,i}));if(shuffle.value==='yes')shuffleArr(opts);playZone.innerHTML='<div class="balloonArea">'+opts.map(x=>`<button class="balloon" onclick="balloonAns(${x.i},this)">${esc(x.o)}</button>`).join('')+'</div>'}
function balloonAns(i,el){const q=questions[order[current]];if(i===q.answer){score++;el.style.transform='scale(0)';el.style.transition='.25s';beep(800);setTimeout(()=>{current++;renderGame()},350)}else{el.classList.add('wrong');beep(200);setTimeout(()=>el.classList.remove('wrong'),400)}}
function renderFrog(q){let opts=q.options.slice(0,4).map((o,i)=>({o,i}));if(shuffle.value==='yes')shuffleArr(opts);let html='<div class="frogLane"><div id="frog" class="frog">🐸</div>';opts.forEach((x,k)=>{html+=`<button class="lily" style="left:${25+k*23}%" onclick="frogAns(${x.i},this)">${esc(x.o)}</button>`});html+='</div>';playZone.innerHTML=html}
function frogAns(i,el){const q=questions[order[current]],frog=document.getElementById('frog');frog.style.left=Math.min(el.offsetLeft,playZone.clientWidth-70)+'px';if(i===q.answer){score++;el.classList.add('correct');beep(760);setTimeout(()=>{current++;renderGame()},600)}else{el.classList.add('wrong');beep(200)}}
function renderTeam(q){const names=['Team A','Team B'];playZone.innerHTML=`<div class="teamgrid"><div class="team"><h3>${names[0]} — ${teamScores[0]}</h3></div><div class="team"><h3>${names[1]} — ${teamScores[1]}</h3></div></div><p class="center"><b>Turn: ${names[teamTurn]}</b></p><div class="options">${q.options.map((o,i)=>`<button class="opt" onclick="teamAns(${i},this)">${esc(o)}</button>`).join('')}</div>`}
function teamAns(i,el){const q=questions[order[current]];document.querySelectorAll('.opt').forEach(b=>b.disabled=true);if(i===q.answer){teamScores[teamTurn]++;score++;el.classList.add('correct');beep(720)}else{el.classList.add('wrong');beep(200)}teamTurn=1-teamTurn;setTimeout(()=>{current++;renderGame()},650)}
function finishGame(){const teamMode=mode.value==='team';let extra='';if(teamMode){let w=teamScores[0]===teamScores[1]?'Draw!':(teamScores[0]>teamScores[1]?'Team A Wins!':'Team B Wins!');extra=`<h2>${w}</h2><p>Team A: ${teamScores[0]} | Team B: ${teamScores[1]}</p>`}gameArea.innerHTML=`<div class="center"><div class="big">🏆</div><h2>Game Complete!</h2><h3>Score: ${score}/${questions.length}</h3>${extra}<button class="primary" onclick="startGame()">🔁 ફરી રમો</button></div>`}
function exportJSON(){const data={title:gameTitle.value,mode:mode.value,questions},blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),x=document.createElement('a');x.href=u;x.download='game-data.json';x.click();URL.revokeObjectURL(u)}
function importJSON(ev){const file=ev.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);questions=d.questions||[];gameTitle.value=d.title||'મારી શૈક્ષણિક રમત';mode.value=d.mode||'mcq';renderList()}catch(e){alert('JSON file યોગ્ય નથી.')}};r.readAsText(file)}
function beep(freq){try{const ac=new (window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freq;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.18);o.start();o.stop(ac.currentTime+.2)}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}renderList();
</script></body></html>
