
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Easy English Simulator - Part 1</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#8fd3ff,#dff7ff);}
.screen{max-width:900px;margin:20px auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
h1{text-align:center;color:#1b5e20}
.center{text-align:center}
input{padding:10px;font-size:18px;border-radius:8px;border:1px solid #aaa;width:70%}
button{padding:10px 18px;margin:8px;border:none;border-radius:10px;background:#2e7d32;color:#fff;font-size:17px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:20px}
.card{background:#e8f5e9;padding:15px;border-radius:12px;text-align:center;cursor:pointer}
.big{font-size:42px;font-weight:bold;color:#1565c0}
.small{font-size:20px}
#lesson{display:none}
.progress{height:18px;background:#ddd;border-radius:9px;overflow:hidden}
.bar{height:100%;width:0;background:#43a047}
</style>
</head>
<body>
<div class="screen" id="home">
<h1>🌟 Easy English Simulator - Part 1</h1>
<p class="center">ગુજરાતી વિદ્યાર્થીઓ માટે English Learning</p>
<div class="center">
<input id="name" placeholder="Enter Student Name">
<br>
<button onclick="start()">Start Learning</button>
</div>
</div>

<div class="screen" id="lesson">
<h2 id="welcome"></h2>
<div class="progress"><div class="bar" id="bar"></div></div>
<p>Click any alphabet.</p>
<div class="grid" id="grid"></div>
<div class="center">
<h2 id="display">A</h2>
<p id="word">Apple 🍎</p>
<button onclick="speak()">🔊 Pronounce</button>
</div>
</div>

<script>
const words={
A:"Apple 🍎",B:"Ball ⚽",C:"Cat 🐱",D:"Dog 🐶",E:"Egg 🥚",F:"Fish 🐟",G:"Goat 🐐",
H:"Hat 👒",I:"Ice 🍨",J:"Jug 🏺",K:"King 👑",L:"Lion 🦁",M:"Mango 🥭",N:"Nest 🪺",
O:"Orange 🍊",P:"Parrot 🦜",Q:"Queen 👸",R:"Rose 🌹",S:"Sun ☀️",T:"Tiger 🐯",
U:"Umbrella ☂️",V:"Van 🚐",W:"Watch ⌚",X:"Xylophone 🎼",Y:"Yak 🦬",Z:"Zoo 🦓"};
let learned=JSON.parse(localStorage.getItem("learned")||"[]");
function start(){
 const n=document.getElementById("name").value||"Student";
 localStorage.setItem("student",n);
 document.getElementById("home").style.display="none";
 document.getElementById("lesson").style.display="block";
 document.getElementById("welcome").innerText="Welcome, "+n;
 const g=document.getElementById("grid");
 g.innerHTML="";
 Object.keys(words).forEach(l=>{
   const d=document.createElement("div");
   d.className="card";
   d.innerHTML="<div class='big'>"+l+"</div><div class='small'>"+words[l]+"</div>";
   d.onclick=()=>show(l);
   g.appendChild(d);
 });
 updateBar();
}
function show(l){
 document.getElementById("display").innerText=l;
 document.getElementById("word").innerText=words[l];
 if(!learned.includes(l)){learned.push(l);localStorage.setItem("learned",JSON.stringify(learned));updateBar();}
}
function updateBar(){document.getElementById("bar").style.width=(learned.length/26*100)+"%";}
function speak(){
 const t=document.getElementById("display").innerText+" "+document.getElementById("word").innerText;
 if("speechSynthesis" in window){speechSynthesis.speak(new SpeechSynthesisUtterance(t));}
 else alert("Speech not supported.");
}
window.onload=()=>{const n=localStorage.getItem("student"); if(n){document.getElementById("name").value=n;}}
</script>
</body>
</html>
