<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Office Utility Pro - Module 1A</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{background:#eef3f8;font-family:Segoe UI,sans-serif}
.header{background:linear-gradient(135deg,#0d6efd,#4f8cff);color:#fff;padding:24px;border-radius:0 0 24px 24px}
.search{border-radius:16px}
.card-tool{border:none;border-radius:18px;box-shadow:0 8px 20px rgba(0,0,0,.08);transition:.2s}
.card-tool:hover{transform:translateY(-3px)}
.icon{font-size:34px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd}
.bottom .nav-link{color:#555}
</style>
</head>
<body>
<div class="header">
<h3><i class="bi bi-briefcase-fill"></i> Office Utility Pro</h3>
<p>Module 1A Dashboard</p>
<input class="form-control search" placeholder="Search tools...">
</div>
<div class="container py-4">
<div class="row g-3">
<div class="col-6"><div class="card card-tool p-3 text-center"><div class="icon">📄</div><h6>Merge PDF</h6></div></div>
<div class="col-6"><div class="card card-tool p-3 text-center"><div class="icon">📝</div><h6>PDF to Word</h6></div></div>
<div class="col-6"><div class="card card-tool p-3 text-center"><div class="icon">🖼️</div><h6>Image to PDF</h6></div></div>
<div class="col-6"><div class="card card-tool p-3 text-center"><div class="icon">📚</div><h6>Split PDF</h6></div></div>
<div class="col-6"><div class="card card-tool p-3 text-center"><div class="icon">🔒</div><h6>Lock PDF</h6></div></div>
<div class="col-6"><div class="card card-tool p-3 text-center"><div class="icon">📤</div><h6>Compress</h6></div></div>
</div>
</div>
<nav class="bottom">
<ul class="nav nav-fill">
<li class="nav-item"><a class="nav-link active" href="#"><i class="bi bi-house-fill"></i><br>Home</a></li>
<li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-grid"></i><br>Tools</a></li>
<li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-gear"></i><br>Settings</a></li>
</ul>
</nav>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
