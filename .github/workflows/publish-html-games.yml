name: Publish HTML games

on:
  push:
    branches: [main]
    paths:
      - 'games-upload.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract games bundle
        run: |
          rm -rf games
          unzip -q -o games-upload.zip -d .
      - name: Commit published games
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games
          if ! git diff --cached --quiet; then
            git commit -m "Publish HTML educational games"
            git push
          fi
