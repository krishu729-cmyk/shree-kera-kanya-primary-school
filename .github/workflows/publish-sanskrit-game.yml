name: Publish School Website and Sanskrit Game
on:
  push:
    branches: [main]
    paths:
      - 'games/std8-sanskrit/**'
      - '.github/workflows/publish-sanskrit-game.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
